version: 2

project_name: osch

before:
  hooks:
    - go mod tidy

builds:
  - id: osch
    main: ./cmd/osch
    binary: osch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    # Breaking changes are matched first so a `feat!:`/`fix!:` commit lands here
    # rather than silently under Features or Bug fixes. Groups are evaluated in
    # order, and the first matching regexp wins.
    - title: Breaking changes
      regexp: '^.*?(feat|fix|chore|docs|refactor|test|ci|build|revert)(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto

homebrew_casks:
  - name: osch
    repository:
      owner: jamessawle
      name: homebrew-tap
      branch: "osch-{{ .Tag }}"
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        base:
          branch: main
    directory: Casks
    homepage: "https://github.com/jamessawle/osch"
    description: "CLI for managing OpenSpec schemas across repos"
    license: "MIT"
    binaries:
      - osch
    # The Linux archives are deliberately included. Homebrew cannot install a
    # cask on Linux, but `brew readall --os=all --arch=all` rejects a cask that
    # resolves no checksum on a platform it evaluates, and GoReleaser has no
    # `depends_on macos:` support to declare the cask macOS-only instead.
    #
    # The postflight hook is GoReleaser's documented remedy for binaries that
    # are neither signed nor notarized. Without it macOS refuses to run the
    # installed executable.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/osch"]
          end
    caveats: |
      osch is not signed or notarized with an Apple Developer certificate.
      Installing it removes the macOS quarantine attribute from the executable
      so that Gatekeeper does not refuse to run it.
