name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.2 # Keep aligned with mise.toml min_version.
          install_args: go

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Casks generated before goreleaser/goreleaser#6752 emit `on_intel`
          # before `on_arm` and a blank line before the closing `end`, which the
          # tap's `brew style` job rejects. That fix is merged but unreleased —
          # the latest stable is 2.17.1 — so this tracks the nightly until
          # 2.18.0 ships. A dated nightly tag cannot be pinned instead because
          # nightlies are pruned after roughly a week. Pin this back to
          # `"~> v2"` once 2.18.0 is out.
          version: nightly
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
