name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
          requireScope: false
          subjectPattern: ^.{1,64}$
          subjectPatternError: |
            The PR title subject (everything after `type(scope):`) must be 1-64
            characters, keeping the full header under 72.
          headerPattern: '^(\w+)(?:\(([\w\-\.\/]+)\))?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
          validateSingleCommit: false
